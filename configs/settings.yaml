simulation:
  n_agents: 10             # Default number of agents (for simulation mode). In App mode, this grows dynamically.
  dimension: 384           # CRITICAL UPDATE: Matches 'all-MiniLM-L6-v2' vector size.
  iterations: 50           # Reduced slightly for speed since vectors are larger now.
  influence_range: [0.1, 1.0] # Min/Max influence an agent can have

weights:
  alpha: 0.5               # Importance of Consensus
  beta: 0.3                # Importance of Leadership Influence
  gamma: 0.2               # Penalty for Conflict

gto:
  silverback_bonus: 1.2    # Multiplier for leader's strength
  migration_rate: 0.1      # 10% chance of randomizing (escaping stagnation)